name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # A passing suite finishes in a couple of minutes; anything approaching this
    # is a hang, and failing fast is cheaper than burning an hour of runner time.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Filament is an optional peer supported on both its current majors, so
        # each is pinned on a leg of its own: left to resolve freely, Composer
        # would take the newer every time and the older would go untested.
        include:
          # Laravel 11 is past its security-support window, so every 11.x
          # release now carries a Packagist advisory and Composer refuses to
          # resolve one. See the install step for why these two legs lift that
          # block and the others do not.
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            filament: '^4.0'
            eol-framework: true
          - php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
            filament: '^5.0'
            eol-framework: true
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            filament: '^4.0'
          # Coverage is identical across the version matrix, so it is collected
          # on a single leg rather than recomputed six times.
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            filament: '^5.0'
            coverage: true
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            filament: '^4.0'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            filament: '^5.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # PCOV is many times faster than Xdebug for line coverage, which is all
          # `--min=100` needs; legs that do not collect coverage carry no driver
          # at all, so nothing instruments their run.
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-filament${{ matrix.filament }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.laravel }}-filament${{ matrix.filament }}-
            composer-${{ matrix.php }}-${{ matrix.laravel }}-
            composer-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          # Composer blocks packages covered by a security advisory, which is
          # the right default and stays on for every leg but the two below.
          #
          # Laravel 11 left security support in early 2026, so the whole 11.x
          # line is now advisoried -- not for a specific bug this package could
          # avoid, but for being end-of-life. Testbench 9 requires it, so with
          # the block on there is no resolvable set at all and the leg cannot
          # run. Applications still on Laravel 11 are exactly the ones that need
          # a package to keep working, so the block is lifted here to prove it
          # does. It is written into the checkout, never into what anyone
          # installs: Composer reads `config` from the root package only.
          if [ "${{ matrix.eol-framework }}" = "true" ]; then
            jq '.config.policy.advisories.block = false' composer.json > composer.tmp
            mv composer.tmp composer.json
          fi

          composer require --dev \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "filament/filament:${{ matrix.filament }}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Lint
        run: composer test:lint

      - name: Refactor check
        run: composer test:refacto

      - name: Static analysis
        run: composer test:types

      # Run single-process on purpose. Pest's type-coverage plugin forks the
      # analysis across several workers, and every worker read-modify-writes one
      # shared result cache; when its lock times out it writes anyway, and the
      # next worker `include`s the interleaved file and dies on a parse error
      # inside the cache rather than on anything wrong with this package.
      #
      # `__PEST_PLUGIN_ENV` is the plugin's own switch for that. It is read from
      # `$_ENV`, which PHP only populates when `variables_order` contains E --
      # the production ini shipped by setup-php does not -- hence the -d.
      - name: Type coverage
        run: php -d variables_order=EGPCS vendor/bin/pest --type-coverage --min=100
        env:
          __PEST_PLUGIN_ENV: '1'

      - name: Unit tests
        run: ${{ matrix.coverage && 'composer test:unit' || 'vendor/bin/pest --colors=always' }}

  # The claim that makes the package installable anywhere: Filament and Livewire
  # are `suggest`, never `require`. This leg is what stops that from quietly
  # becoming untrue -- it installs neither and runs everything that is not about
  # them.
  bare:
    name: No optional packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies without the optional peers
        run: |
          composer remove --dev filament/filament livewire/livewire --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Prove neither is installed
        run: |
          test ! -d vendor/filament
          test ! -d vendor/livewire

      - name: Unit tests
        run: |
          vendor/bin/pest --colors=always \
            tests/ArchTest.php \
            tests/Unit tests/Feature tests/Disabled tests/Scheduled tests/Misconfigured

  # The viewer's own build and its tests. The bundle is committed, so the thing
  # worth checking is that what is committed is what the sources produce -- a
  # stale bundle would ship an old viewer to everyone who ran vendor:publish.
  viewer:
    name: Viewer bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Coordinate, API, store and re-anchoring tests
        run: npm test

      - name: Rebuild and check the committed bundle is current
        run: |
          npm run build
          git diff --exit-code --stat resources/dist \
            || (echo "resources/dist is stale -- run 'npm run build' and commit the result" && exit 1)
